<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Abstract scale of justice + modern wordmark -->
  <g transform="translate(8,12)">
    <!-- Scale base -->
    <rect x="26" y="48" width="12" height="8" rx="1" fill="#0f2c59"/>
    <rect x="20" y="54" width="24" height="4" rx="1" fill="#0f2c59"/>
    <!-- Pillar -->
    <rect x="30" y="10" width="4" height="40" fill="#0f2c59"/>
    <!-- Beam -->
    <rect x="8" y="12" width="48" height="3" rx="1" fill="#c9a227"/>
    <!-- Left pan -->
    <path d="M12 18 L4 36 H20 Z" fill="#0f2c59" opacity="0.85"/>
    <circle cx="12" cy="18" r="2.5" fill="#c9a227"/>
    <!-- Right pan -->
    <path d="M52 18 L44 36 H60 Z" fill="#0f2c59" opacity="0.85"/>
    <circle cx="52" cy="18" r="2.5" fill="#c9a227"/>
  </g>
  <!-- Wordmark -->
  <text x="78" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#0f2c59" letter-spacing="-0.5">Talent</text>
  <text x="78" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" fill="#c9a227" letter-spacing="1">LegalWorks</text>
</svg>
